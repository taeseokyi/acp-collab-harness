<!DOCTYPE html>
<html lang="ko" data-theme="light" data-colorblind="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웹워들</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <button type="button" class="icon-btn" id="btn-help" aria-label="도움말">?</button>
      <h1>웹워들</h1>
      <div class="header-right">
        <button type="button" class="icon-btn" id="btn-stats" aria-label="통계">📊</button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="설정">⚙</button>
      </div>
    </header>
    <main id="main">
      <div id="board" class="board" role="grid" aria-label="추측 판"></div>
      <div id="keyboard" class="keyboard" role="group" aria-label="화면 키보드"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <div id="modal-help" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="t-help" tabindex="-1">
      <button type="button" class="modal-close" aria-label="닫기">✕</button>
      <h2 id="t-help">하는 법</h2>
      <p>여섯 번 안에 다섯 글자 영어 단어를 맞히세요. 추측할 때마다 칸의 색이 단서가 됩니다.</p>
      <ul>
        <li>추측은 사전에 있는 다섯 글자 단어여야 합니다.</li>
        <li>제출하면 칸 색이 바뀌어 정답과 얼마나 가까운지 알려 줍니다.</li>
      </ul>
      <h3>예시</h3>
      <div class="example"><div class="tile" data-state="correct">W</div><div class="tile" data-state="empty">E</div><div class="tile" data-state="empty">A</div><div class="tile" data-state="empty">R</div><div class="tile" data-state="empty">Y</div></div>
      <p><b>W</b> 는 단어에 있고 자리도 맞습니다.</p>
      <div class="example"><div class="tile" data-state="empty">P</div><div class="tile" data-state="present">I</div><div class="tile" data-state="empty">L</div><div class="tile" data-state="empty">L</div><div class="tile" data-state="empty">S</div></div>
      <p><b>I</b> 는 단어에 있지만 다른 자리입니다.</p>
      <div class="example"><div class="tile" data-state="empty">V</div><div class="tile" data-state="empty">A</div><div class="tile" data-state="empty">G</div><div class="tile" data-state="absent">U</div><div class="tile" data-state="empty">E</div></div>
      <p><b>U</b> 는 단어 어디에도 없습니다.</p>
      <p>오늘의 단어는 모두에게 같고, 하루에 하나입니다.</p>
    </div>
  </div>

  <div id="modal-stats" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="t-stats" tabindex="-1">
      <button type="button" class="modal-close" aria-label="닫기">✕</button>
      <h2 id="t-stats">통계</h2>
      <div class="stat-row" id="stat-row"></div>
      <h3>추측 분포</h3>
      <div id="dist" class="dist"></div>
      <button type="button" class="primary" id="btn-share" hidden>공유</button>
    </div>
  </div>

  <div id="modal-settings" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="t-set" tabindex="-1">
      <button type="button" class="modal-close" aria-label="닫기">✕</button>
      <h2 id="t-set">설정</h2>
      <label class="setting"><span><b>하드 모드</b><small>찾은 힌트를 다음 추측에 꼭 써야 합니다 (판 시작 전에만 변경)</small></span><input type="checkbox" id="set-hard" role="switch"></label>
      <label class="setting"><span><b>어두운 테마</b></span><input type="checkbox" id="set-dark" role="switch"></label>
      <label class="setting"><span><b>색약 모드</b><small>주황·파랑으로 구분합니다</small></span><input type="checkbox" id="set-cb" role="switch"></label>
    </div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
